name: Deploy Docker Space
on:
  push:
    branches: [main]
    paths: [Dockerfile, app.py, web/**, requirements.txt, README.md, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cagents-space
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify source
        run: |
          python3 -m py_compile app.py
          node --check web/app.mjs
      - name: Check OpenHarness integration
        run: |
          python3 -m venv /tmp/cagents-ci
          /tmp/cagents-ci/bin/pip -q install openharness-ai==0.1.9 fastapi==0.121.3 huggingface-hub==0.36.0
          /tmp/cagents-ci/bin/python - <<'PY'
          import asyncio
          from unittest.mock import patch
          from openharness.api.usage import UsageSnapshot
          from app import BimoProvider, Review, review_bimo

          async def main():
              updates = asyncio.Queue()
              with patch("app.load_bimo", return_value=(None, None)), patch.object(
                  BimoProvider, "complete", return_value=("Review smoke test", UsageSnapshot())
              ):
                  await review_bimo(Review(prompt="Review a test configuration."), "unused", updates)
              events = []
              while not updates.empty():
                  events.append(updates.get_nowait())
              assert {"answer": "Review smoke test"} in events, events
          asyncio.run(main())
          PY
      - name: Check CPU quantization
        run: |
          /tmp/cagents-ci/bin/pip -q install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          /tmp/cagents-ci/bin/pip -q install -r requirements.txt
          /tmp/cagents-ci/bin/python - <<'PY'
          from tempfile import TemporaryDirectory
          import torch
          from bitsandbytes.nn import Linear4bit
          from transformers import Qwen2Config, Qwen2ForCausalLM
          from app import load_quantized_model

          config = Qwen2Config(vocab_size=256, hidden_size=64, intermediate_size=128,
                               num_hidden_layers=1, num_attention_heads=4,
                               num_key_value_heads=2, bos_token_id=1, eos_token_id=2,
                               pad_token_id=0, max_position_embeddings=128)
          with TemporaryDirectory() as path:
              Qwen2ForCausalLM(config).save_pretrained(path)
              model = load_quantized_model(path, trust_remote_code=False)
              assert any(isinstance(layer, Linear4bit) for layer in model.modules())
              with torch.inference_mode():
                  assert model.generate(torch.tensor([[1, 3, 5]]), max_new_tokens=2).shape[1] >= 4
          PY
      - name: Check browser runtime package
        run: |
          npm install --prefix /tmp/cagents-web --no-audit --no-fund --ignore-scripts @wllama/wllama@3.8.1
          test -f /tmp/cagents-web/node_modules/@wllama/wllama/esm/index.js
          test -f /tmp/cagents-web/node_modules/@wllama/wllama/esm/wasm/wllama.wasm
      - name: Upload Docker Space
        uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: Wuhpondiscord/cagents
          huggingface_repo_id: wuhp/cagents
          hf_token: ${{ secrets.HF_TOKEN }}
          space_sdk: docker
          delete_removed: 'false'
          include: |
            README.md
            Dockerfile
            requirements.txt
            app.py
            web/**
