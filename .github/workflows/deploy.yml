name: Deploy Docker Space
on:
  push:
    branches: [main]
    paths: [Dockerfile, app.py, agent.py, web/**, requirements.txt, README.md, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cagents-space
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify source
        run: |
          python3 -m py_compile app.py agent.py
          node --check web/app.mjs
      - name: Check OpenHarness integration
        run: |
          python3 -m venv /tmp/cagents-ci
          /tmp/cagents-ci/bin/pip -q install openharness-ai==0.1.9 fastapi==0.121.3 huggingface-hub==0.36.0
          /tmp/cagents-ci/bin/python - <<'PY'
          import json
          from unittest.mock import patch
          from fastapi.testclient import TestClient
          from openharness.api.usage import UsageSnapshot
          from app import BimoProvider, app

          def bimo_generation(provider, request):
              messages = provider.build_messages(request)
              if provider.tool_calls == 0:
                  return '<agent_tool>{"name":"read_upload","arguments":{"file":"test.log"}}</agent_tool>', UsageSnapshot()
              assert "service is listening" in messages[-1]["content"], messages
              return "Bimo found the service.", UsageSnapshot()

          upload = {"name": "test.log", "text": "startup\nservice is listening\nready"}
          with TestClient(app, base_url="http://testserver") as client:
              assert client.get("/api/status").json() == {"bimo": "needs_load"}
              with patch("app.load_bimo", return_value=(None, None)), patch.object(
                  BimoProvider, "complete", bimo_generation
              ):
                  response = client.post("/api/bimo", json={"prompt": "Read the log", "uploads": [upload]},
                                         headers={"Authorization": "Bearer hf_testtesttest"})
                  updates = [json.loads(line[6:]) for line in response.text.splitlines() if line.startswith("data: ")]
                  assert {"tool": "read_upload"} in updates, updates
                  assert {"answer": "Bimo found the service."} in updates, updates

              with client.websocket_connect("/api/xortron", headers={"Origin": "http://testserver"}) as socket:
                  socket.send_json({"prompt": "Follow up on the service.",
                                    "history": [{"role": "user", "text": "Read the log"},
                                                {"role": "assistant", "text": "Bimo found the service."}],
                                    "uploads": [upload]})
                  first = socket.receive_json()
                  assert any(message["content"] == "Bimo found the service." for message in first["generate"]), first
                  socket.send_json({"answer": '<agent_tool>{"name":"search_uploads","arguments":{"query":"ready"}}</agent_tool>'})
                  assert socket.receive_json() == {"tool": "search_uploads"}
                  second = socket.receive_json()
                  assert "test.log:3: ready" in second["generate"][-1]["content"], second
                  socket.send_json({"answer": "The service is ready."})
                  assert socket.receive_json() == {"answer": "The service is ready."}
          PY
      - name: Check CPU quantization
        run: |
          /tmp/cagents-ci/bin/pip -q install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          /tmp/cagents-ci/bin/pip -q install -r requirements.txt
          /tmp/cagents-ci/bin/python - <<'PY'
          from tempfile import TemporaryDirectory
          import torch
          from bitsandbytes.nn import Linear4bit
          from transformers import Qwen2Config, Qwen2ForCausalLM
          from app import load_quantized_model

          config = Qwen2Config(vocab_size=256, hidden_size=64, intermediate_size=128,
                               num_hidden_layers=1, num_attention_heads=4,
                               num_key_value_heads=2, bos_token_id=1, eos_token_id=2,
                               pad_token_id=0, max_position_embeddings=128)
          with TemporaryDirectory() as path:
              Qwen2ForCausalLM(config).save_pretrained(path)
              model = load_quantized_model(path, trust_remote_code=False)
              assert any(isinstance(layer, Linear4bit) for layer in model.modules())
              with torch.inference_mode():
                  assert model.generate(torch.tensor([[1, 3, 5]]), max_new_tokens=2).shape[1] >= 4
          PY
      - name: Check browser runtime package
        run: |
          npm install --prefix /tmp/cagents-web --no-audit --no-fund --ignore-scripts @wllama/wllama@3.8.1
          test -f /tmp/cagents-web/node_modules/@wllama/wllama/esm/index.js
          test -f /tmp/cagents-web/node_modules/@wllama/wllama/esm/wasm/wllama.wasm
      - name: Upload Docker Space
        uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: Wuhpondiscord/cagents
          huggingface_repo_id: wuhp/cagents
          hf_token: ${{ secrets.HF_TOKEN }}
          space_sdk: docker
          delete_removed: 'false'
          include: |
            README.md
            Dockerfile
            requirements.txt
            app.py
            agent.py
            web/**
